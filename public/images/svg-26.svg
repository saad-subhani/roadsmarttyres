<svg class="ico-chat" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Tyre -->
    <circle cx="18" cy="28" r="6" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="18" cy="28" r="2.5" fill="#fff" opacity="0.4"/>
    <line x1="18" y1="22" x2="18" y2="34" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
    <line x1="12" y1="28" x2="24" y2="28" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
    <!-- Robot body -->
    <rect x="10" y="10" width="16" height="12" rx="3" fill="#fff" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="14.5" cy="15" r="1.8" fill="#E01010"/>
    <circle cx="21.5" cy="15" r="1.8" fill="#E01010"/>
    <!-- Mouth -->
    <rect x="13.5" y="18.5" width="9" height="1.5" rx="0.75" fill="#E01010" opacity="0.7"/>
    <!-- Antenna -->
    <line x1="18" y1="10" x2="18" y2="6.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="18" cy="5.5" r="1.2" fill="#fff"/>
    <!-- Ears -->
    <rect x="7" y="13" width="3" height="5" rx="1.5" fill="#fff" opacity="0.6"/>
    <rect x="26" y="13" width="3" height="5" rx="1.5" fill="#fff" opacity="0.6"/>
    <!-- Neck -->
    <rect x="16.5" y="22" width="3" height="3" rx="0.5" fill="#fff" opacity="0.5"/>
  </svg>